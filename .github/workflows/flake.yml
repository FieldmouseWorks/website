# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@8121c5e4947ad8b7f0b41a9653388be02b6b4fbd # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
