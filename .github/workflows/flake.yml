# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@ebac4a78c6d4a313a5df0568cade857326c56c0f # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
